[package]
name = "potoo-algobox-interpreter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-algobox-interpreter"
homepage = "https://diegopn.github.io/potoo-site/manual/algobox/"
readme = "README.md"
description = "A Rust interpreter for the textual AlgoBox educational algorithm language."

[lib]
name = "potoo_algobox_interpreter"
path = "src/lib.rs"

[[bin]]
name = "potoo-algobox"
path = "src/bin/potoo-algobox.rs"
